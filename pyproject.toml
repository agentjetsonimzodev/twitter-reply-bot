# ============================================================================
# Twitter Reply Bot — tool configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
# Exclude docs that contain Python code examples (not actual source):
#   - plan/   — per-phase reference docs
#   - **/*.md — all markdown files
# Both contain Python snippets inside ```python blocks that shouldn't be
# linted/formatted as if they were real source code.
extend-exclude = [".venv", "venv", "build", "dist", "plan", "**/*.md"]

[tool.ruff.lint]
# Default ruleset:
#   E, W  — pycodestyle (errors, warnings)
#   F     — pyflakes (unused imports, undefined names, etc.)
#   I     — isort (import sorting)
#   UP    — pyupgrade (modern Python syntax for target-version)
#   B     — flake8-bugbear (likely bugs)
#   C4    — flake8-comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "tests"]

[tool.mypy]
python_version = "3.11"
# Strict-ish: every def needs type hints, but don't fail on missing 3rd-party stubs.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
# 3rd-party libs (tweepy, twikit, openai, anthropic, APScheduler) don't ship
# type stubs. Don't fail on those — we'll add stubs selectively as needed.
ignore_missing_imports = true
# Exclude the docs/plan folder from type checking (Markdown Python examples
# aren't real source code).
exclude = ["plan/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",                # show summary of all outcomes at the end
    "--strict-markers",   # fail on unknown markers (typo protection)
    "--tb=short",         # shorter tracebacks
]
markers = [
    "integration: marks tests as integration (hit real network/services — NOT run in CI by default)",
]
